AWSTemplateFormatVersion: "2010-09-09"
Description: GarageMate API server - one Ubuntu 24.04 EC2 instance with a fixed public IP (free tier)

# Creates the box only. Code, .env, nginx, gunicorn and HTTPS are set up by setup_ec2.sh over SSH,
# so no secrets end up in this template or in CloudFormation.
#
#   aws cloudformation deploy --stack-name garagemate-api --template-file deploy/ec2-stack.yaml \
#     --parameter-overrides KeyName=garagemate-key SshCidr=<your ip>/32

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small]
    Description: Both are free tier eligible, t3.small has 2 GB RAM which pip and gunicorn like better
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing key pair used for SSH
  SshCidr:
    Type: String
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
    Description: Only this range can SSH in, e.g. 203.0.113.10/32
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Latest Ubuntu 24.04 LTS image, resolved from the public SSM parameter

Resources:
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GarageMate API - ssh from the admin IP, http and https from anywhere
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
          Description: ssh
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: http - lets encrypt challenge and redirect to https
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: https
      Tags:
        - Key: Name
          Value: garagemate-api

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !GetAtt ApiSecurityGroup.GroupId
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: garagemate-api

  ApiAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref ApiInstance
      Tags:
        - Key: Name
          Value: garagemate-api

Outputs:
  PublicIp:
    Value: !Ref ApiAddress
  Domain:
    Description: Free DNS name for the IP, used for the HTTPS certificate
    Value: !Join ["", [!Join ["-", !Split [".", !Ref ApiAddress]], ".sslip.io"]]
  SshCommand:
    Value: !Sub "ssh -i ~/.ssh/${KeyName}.pem ubuntu@${ApiAddress}"
